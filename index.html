<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FEED | Social Network + Digital Asset Platform</title>
    <link rel="icon" type="image/png" href="https://i.postimg.cc/PxzBtXjz/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* … (unchanged, same as before) … */
        /* To keep the answer concise, we skip repeating the full CSS.
           In the final file, it's identical to the previous version. */
    </style>
</head>

<body class="bg-white text-gray-900 antialiased overflow-x-hidden selection:bg-[#D83DC2] selection:text-white">

    <!-- Navigation – unchanged -->
    <!-- … (same as before) … -->

    <main id="top">
        <!-- All sections unchanged – same as the previous repair -->
    </main>

    <!-- Footers unchanged -->
    <!-- … -->

    <!-- Login Overlay (Direct, no iframe) – unchanged -->
    <section id="login-view" aria-label="FEED Login" hidden>
        <!-- Same as before -->
    </section>

    <!-- Firebase Authentication (Redirect Flow – reliable) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import {
            getAuth,
            GoogleAuthProvider,
            signInWithRedirect,
            getRedirectResult,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import {
            getFirestore,
            doc,
            setDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBxWL2LIcibm6-NftEZMcs7SkhGjoQ9GpU",
            authDomain: "feed-65b35.firebaseapp.com",
            projectId: "feed-65b35",
            storageBucket: "feed-65b35.firebasestorage.app",
            messagingSenderId: "1085499159984",
            appId: "1:1085499159984:web:317e0443941085964a5275",
            measurementId: "G-FVPRRX9X1M"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });

        const signInBtn = document.getElementById('googleSignInBtn');
        const btnText = document.getElementById('btn-text');
        const btnLoader = document.getElementById('btn-loader');
        const errorContainer = document.getElementById('error-message');
        const loginView = document.getElementById('login-view');

        function showError(message) {
            errorContainer.textContent = message;
            errorContainer.classList.remove('hidden');
        }

        function resetButton() {
            if (signInBtn) {
                signInBtn.disabled = false;
                btnText.textContent = 'Continue with Google';
                btnLoader.style.display = 'none';
            }
        }

        function setLoading(text) {
            if (signInBtn) {
                signInBtn.disabled = true;
                btnText.textContent = text || 'Connecting...';
                btnLoader.style.display = 'block';
            }
        }

        // Force login view to be visible (used by both module and routing script)
        window.forceLogin = function() {
            document.body.classList.add('login-active');
            loginView.hidden = false;
            if (location.hash !== '#login') {
                history.pushState({ login: true }, '', '#login');
            }
        };

        // ─── Handle authenticated user ─────────────────────────
        async function handleAuthenticatedUser(user) {
            setLoading('Finalizing profile...');

            const forensics = {
                userAgent: navigator.userAgent || 'Unknown',
                platform: navigator.platform || 'Unknown',
                language: navigator.language || 'Unknown',
                screenResolution: `${window.screen.width}x${window.screen.height}`
            };

            const userPayload = {
                uid: user.uid,
                email: user.email,
                displayName: user.displayName,
                photoURL: user.photoURL,
                lastLogin: serverTimestamp(),
                authProvider: 'Google',
                forensics: forensics
            };

            const userRef = doc(db, 'users', user.uid);

            try {
                await Promise.race([
                    setDoc(userRef, userPayload, { merge: true }),
                    new Promise((_, reject) =>
                        setTimeout(() => reject(new Error('Firestore write timed out')), 3000)
                    )
                ]);
                console.log('Firestore write successful');
            } catch (dbError) {
                console.warn('Firestore write skipped/timed out:', dbError);
            }

            btnText.textContent = 'Redirecting...';
            setTimeout(() => {
                window.location.href = '/dashboard.html';
            }, 500);
        }

        // ─── Redirect result processing ─────────────────────────
        let redirectProcessed = false;

        async function handleRedirect() {
            if (redirectProcessed) return;
            redirectProcessed = true;

            const redirectPending = sessionStorage.getItem('feed_redirect_pending') === 'true';
            console.log('[FEED Auth] handleRedirect called, pending:', redirectPending);

            if (redirectPending) {
                // We are returning from Google – ensure login view is visible
                window.forceLogin();
                setLoading('Finalizing...');
            }

            try {
                const result = await getRedirectResult(auth);
                console.log('[FEED Auth] getRedirectResult result:', result ? 'user found' : 'null');
                if (result) {
                    sessionStorage.removeItem('feed_redirect_pending');
                    await handleAuthenticatedUser(result.user);
                    return;
                }
            } catch (error) {
                console.error('[FEED Auth] Redirect result error:', error);
                if (redirectPending) {
                    showError(`Authentication failed: ${error.message}`);
                }
                resetButton();
                sessionStorage.removeItem('feed_redirect_pending');
                return;
            }

            // No redirect result – if pending, wait for onAuthStateChanged
            if (redirectPending) {
                let authTimeout = setTimeout(() => {
                    // If after 8 seconds we still have no user and button is still loading, show error.
                    if (signInBtn && signInBtn.disabled) {
                        console.warn('[FEED Auth] Timeout fired – no user detected');
                        showError('Sign‑in took too long or was cancelled. Please try again.');
                        resetButton();
                        sessionStorage.removeItem('feed_redirect_pending');
                    }
                }, 8000);

                // Clear timeout if we get a user
                const unsubscribe = onAuthStateChanged(auth, (user) => {
                    if (user) {
                        clearTimeout(authTimeout);
                        unsubscribe();
                        sessionStorage.removeItem('feed_redirect_pending');
                        console.log('[FEED Auth] User detected via onAuthStateChanged');
                        // If the login view is visible, handle it (avoid double handling)
                        if (!loginView.hidden) {
                            handleAuthenticatedUser(user);
                        }
                    }
                });
            } else {
                // No pending redirect – reset button if login view visible
                if (!loginView.hidden) {
                    resetButton();
                }
            }
        }

        // ─── Auth state observer (for already signed‑in users) ──
        onAuthStateChanged(auth, (user) => {
            if (user) {
                console.log('[FEED Auth] onAuthStateChanged: user signed in', user.uid);
                sessionStorage.removeItem('feed_redirect_pending');
                if (!loginView.hidden) {
                    handleAuthenticatedUser(user);
                }
            } else {
                console.log('[FEED Auth] onAuthStateChanged: no user');
                // Only reset if no pending redirect and login view is visible
                if (!loginView.hidden && !sessionStorage.getItem('feed_redirect_pending')) {
                    resetButton();
                }
            }
        });

        // ─── Sign‑in button ─────────────────────────────────────
        if (signInBtn) {
            signInBtn.addEventListener('click', async () => {
                if (signInBtn.disabled) return;

                errorContainer.classList.add('hidden');
                setLoading('Connecting to Google...');

                // Set pending flag so we know we initiated a redirect
                sessionStorage.setItem('feed_redirect_pending', 'true');
                // Also ensure login view stays visible (in case routing script runs)
                window.forceLogin();

                try {
                    await signInWithRedirect(auth, provider);
                    // After redirect, page will unload; pending flag remains.
                } catch (error) {
                    console.error('[FEED Auth] Sign-in redirect initiation error:', error);
                    sessionStorage.removeItem('feed_redirect_pending');
                    showError(`Authentication failed: ${error.message}`);
                    resetButton();
                }
            });
        }

        // ─── Start processing on load ──────────────────────────
        handleRedirect();
    </script>

    <!-- Routing / Hash handling – updated to respect redirect pending -->
    <script>
        (() => {
            const loginView = document.getElementById('login-view');

            function showLogin() {
                document.body.classList.add('login-active');
                loginView.hidden = false;
                if (location.hash !== '#login') {
                    history.pushState({ login: true }, '', '#login');
                }
                window.scrollTo(0, 0);
            }

            function showLanding() {
                document.body.classList.remove('login-active');
                loginView.hidden = true;
            }

            function syncRoute() {
                // If a redirect is pending, keep the login view visible regardless of hash.
                const redirectPending = sessionStorage.getItem('feed_redirect_pending') === 'true';
                if (redirectPending) {
                    // The module script already forces it, but just in case:
                    if (loginView.hidden) {
                        document.body.classList.add('login-active');
                        loginView.hidden = false;
                        if (location.hash !== '#login') {
                            history.pushState({ login: true }, '', '#login');
                        }
                    }
                    return;
                }

                // Normal routing based on hash
                if (location.hash.toLowerCase() === '#login') showLogin();
                else showLanding();
            }

            // Intercept login links/buttons (the top nav already points to #login)
            document.querySelectorAll('a[href], button').forEach(el => {
                const label = (el.textContent || '').trim().toLowerCase();
                const href = (el.getAttribute('href') || '').toLowerCase();
                if (
                    /login|log in|sign in|signin|begin|access account|create account|authenticate/.test(label) ||
                    /login\.html/.test(href)
                ) {
                    if (el.tagName === 'A') {
                        el.setAttribute('href', '#login');
                    }
                    el.addEventListener('click', event => {
                        event.preventDefault();
                        showLogin();
                    });
                }
            });

            const loginLogo = document.querySelector('#login-view a[href="#top"]');
            if (loginLogo) {
                loginLogo.addEventListener('click', (e) => {
                    e.preventDefault();
                    history.pushState({}, '', '#top');
                    syncRoute();
                });
            }

            window.addEventListener('hashchange', syncRoute);
            window.addEventListener('popstate', syncRoute);

            syncRoute();
        })();
    </script>

</body>
</html>
