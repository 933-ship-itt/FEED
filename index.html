<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FEED | Social Network + Digital Asset Platform</title>
    <link rel="icon" type="image/png" href="https://i.postimg.cc/W18WjK3V/image-(1).png" />
    <script src="https://cdn.tailwindcss.com">
    </script>
    <script src="https://unpkg.com/@phosphor-icons/web">
    </script>
    <style>
        /* ============================================================
           GLOBAL STYLES / CSS VARIABLES
           ============================================================ */
        @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --violet: #6036E1;
            --magenta: #D83DC2;
            --ink: #0b0b12;
            --line: #ececf3;
            --soft: #f8f8fc;
            --gradient: linear-gradient(to right, #6036E1, #D83DC2);
            --shadow: 0 24px 80px rgba(32, 18, 80, 0.10);
        }

        * {
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Inter', sans-serif;
            background:
                radial-gradient(circle at 80% 5%, rgba(216, 61, 194, 0.09), transparent 26%),
                radial-gradient(circle at 10% 12%, rgba(96, 54, 225, 0.09), transparent 24%),
                #fff;
            color: var(--ink);
            overflow-x: hidden;
        }

        .font-display {
            font-family: 'Archivo', sans-serif;
        }
        .text-gradient {
            background: var(--gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .bg-gradient-custom {
            background: var(--gradient);
            transition: transform 0.25s ease, box-shadow 0.25s ease, opacity 0.25s ease;
        }
        .bg-gradient-custom:hover:not(:disabled) {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 16px 35px rgba(96, 54, 225, 0.22);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(100%);
            transform: none !important;
            box-shadow: none !important;
        }

        .border-gradient {
            position: relative;
            padding: 1px;
            border-radius: 9999px;
            background: var(--gradient);
        }
        .border-gradient>div {
            background: #fff;
            border-radius: 9999px;
        }

        .glass {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(0, 0, 0, 0.06);
        }

        .soft-grid {
            background-image:
                linear-gradient(rgba(96, 54, 225, 0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(96, 54, 225, 0.045) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .section-kicker {
            font-size: 11px;
            letter-spacing: .18em;
            text-transform: uppercase;
            font-weight: 700;
            color: #7b7890;
        }

        .premium-card {
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.88);
            box-shadow: 0 18px 60px rgba(23, 18, 43, 0.06);
        }
        .premium-card:hover {
            box-shadow: var(--shadow);
            transform: translateY(-3px);
        }

        .number-chip {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            background: #f4f1ff;
            color: var(--violet);
        }

        .timeline-line {
            position: absolute;
            left: 19px;
            top: 50px;
            bottom: -25px;
            width: 1px;
            background: linear-gradient(to bottom, rgba(96, 54, 225, .3), rgba(216, 61, 194, .08));
        }

        .metric {
            border-top: 1px solid var(--line);
            padding-top: 16px;
        }

        .faq details {
            border-top: 1px solid var(--line);
            padding: 22px 0;
        }
        .faq details:last-child {
            border-bottom: 1px solid var(--line);
        }
        .faq summary {
            cursor: pointer;
            list-style: none;
            font-weight: 600;
        }
        .faq summary::-webkit-details-marker {
            display: none;
        }

        .gradient-orbit {
            box-shadow:
                0 0 0 1px rgba(96, 54, 225, 0.12),
                0 25px 80px rgba(96, 54, 225, 0.12),
                inset 0 0 60px rgba(216, 61, 194, 0.06);
        }

        .trust-strip {
            border-top: 1px solid #ececf3;
            border-bottom: 1px solid #ececf3;
            background: rgba(255, 255, 255, .78);
            backdrop-filter: blur(18px);
        }

        .trust-item {
            position: relative;
            transition: transform .25s ease, opacity .25s ease;
        }
        .trust-item::after {
            content: "";
            position: absolute;
            right: 0;
            top: 50%;
            width: 1px;
            height: 20px;
            transform: translateY(-50%);
            background: #e8e8ef;
        }
        .trust-item:last-child::after {
            display: none;
        }

        .architecture-card {
            position: relative;
            overflow: hidden;
            border: 1px solid #e9e8f1;
            background: linear-gradient(180deg, #fff, #fbfbfe);
            box-shadow: 0 18px 60px rgba(34, 22, 70, .07);
            transition: transform .35s ease, box-shadow .35s ease, border-color .35s ease;
        }
        .architecture-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 28px 90px rgba(34, 22, 70, .12);
            border-color: rgba(96, 54, 225, .22);
        }
        .architecture-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent 18%, rgba(96, 54, 225, .06) 48%, rgba(216, 61, 194, .06) 62%, transparent 82%);
            transform: translateX(-120%);
            transition: transform .9s ease;
        }
        .architecture-card:hover::before {
            transform: translateX(120%);
        }

        .flow-connector {
            position: absolute;
            left: 50%;
            bottom: -26px;
            width: 1px;
            height: 28px;
            background: linear-gradient(to bottom, rgba(96, 54, 225, .35), rgba(216, 61, 194, .2));
        }
        .flow-dot {
            position: absolute;
            left: -3px;
            top: 0;
            width: 7px;
            height: 7px;
            border-radius: 999px;
            background: #6036E1;
            box-shadow: 0 0 0 5px rgba(96, 54, 225, .08);
            animation: flowPulse 2.2s ease-in-out infinite;
        }
        @keyframes flowPulse {
            0%,
            100% {
                transform: translateY(0);
                opacity: .65;
            }
            50% {
                transform: translateY(18px);
                opacity: 1;
            }
        }

        .compare-table>div {
            transition: background .2s ease;
        }
        .compare-table>div:hover {
            background: #faf9ff;
        }

        .social-window {
            border: 1px solid rgba(255, 255, 255, .09);
            box-shadow: 0 30px 100px rgba(0, 0, 0, .28);
            background: rgba(255, 255, 255, .035);
            backdrop-filter: blur(20px);
        }
        .social-channel {
            transition: transform .2s ease, background .2s ease;
        }
        .social-channel:hover {
            transform: translateX(3px);
            background: rgba(255, 255, 255, .06);
        }

        .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 999px;
            background: #D83DC2;
            box-shadow: 0 0 0 5px rgba(216, 61, 194, .12);
            animation: livePulse 1.6s ease-in-out infinite;
        }
        @keyframes livePulse {
            0%,
            100% {
                opacity: .6;
            }
            50% {
                opacity: 1;
                box-shadow: 0 0 0 9px rgba(216, 61, 194, 0);
            }
        }

        .security-node {
            border: 1px solid #e7e6ef;
            background: #fff;
            transition: transform .28s ease, box-shadow .28s ease;
        }
        .security-node:hover {
            transform: translateY(-4px);
            box-shadow: 0 22px 70px rgba(35, 23, 72, .09);
        }

        .security-line {
            height: 1px;
            background: linear-gradient(to right, rgba(96, 54, 225, .18), rgba(216, 61, 194, .28));
            position: relative;
        }
        .security-line::after {
            content: "";
            position: absolute;
            top: -3px;
            left: 0;
            width: 7px;
            height: 7px;
            border-radius: 99px;
            background: #6036E1;
            animation: lineTravel 2.8s linear infinite;
        }
        @keyframes lineTravel {
            0% {
                left: 0;
                opacity: .2;
            }
            12% {
                opacity: 1;
            }
            88% {
                opacity: 1;
            }
            100% {
                left: calc(100% - 7px);
                opacity: .2;
            }
        }

        .metric-pill {
            border: 1px solid #e6e5ee;
            background: #fff;
            transition: transform .25s ease, box-shadow .25s ease;
        }
        .metric-pill:hover {
            transform: translateY(-3px);
            box-shadow: 0 18px 50px rgba(28, 20, 62, .08);
        }

        .reveal {
            opacity: 0;
            transform: translateY(18px);
            transition: opacity .7s ease, transform .7s ease;
        }
        .reveal.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        .reveal-delay-1 {
            transition-delay: .08s;
        }
        .reveal-delay-2 {
            transition-delay: .16s;
        }
        .reveal-delay-3 {
            transition-delay: .24s;
        }
        .reveal-delay-4 {
            transition-delay: .32s;
        }

        .gradient-border {
            position: relative;
            border: 1px solid transparent;
            background:
                linear-gradient(#fff, #fff) padding-box,
                linear-gradient(to right, #6036E1, #D83DC2) border-box;
        }

        /* ============================================================
           VIEW STATES
           ============================================================ */
        #login-view[hidden] {
            display: none !important;
        }
        #dashboard-view[hidden] {
            display: none !important;
        }

        /* ============================================================
           DASHBOARD SHELL
           ============================================================ */
        .dashboard-shell {
            background-color: #f8f8fc;
            background-image:
                radial-gradient(circle at 100% 0%, rgba(216, 61, 194, .04), transparent 30%),
                radial-gradient(circle at 0% 100%, rgba(96, 54, 225, .04), transparent 30%);
            overflow-x: hidden;
        }
        .dashboard-sidebar {
            overflow: hidden;
        }
        .dashboard-sidebar nav {
            min-width: 0;
            overflow-x: hidden;
            overflow-y: auto;
            scrollbar-width: none;
        }
        .dashboard-sidebar nav::-webkit-scrollbar {
            width: 0;
            height: 0;
        }
        .dashboard-tab,
        #dashboardSignOut {
            min-width: 0;
            overflow: hidden;
        }
        .dashboard-tab i,
        #dashboardSignOut i {
            flex: 0 0 24px;
        }
        .dashboard-label {
            display: block;
            max-width: 0;
            min-width: 0;
            overflow: hidden;
            text-overflow: clip;
        }
        .dashboard-sidebar:hover .dashboard-label {
            max-width: 220px;
        }
        .dashboard-sidebar:not(:hover) .dashboard-label {
            margin-left: 0 !important;
            opacity: 0 !important;
        }
        .dashboard-glass {
            background: rgba(255, 255, 255, .86);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, .7);
            box-shadow: 0 18px 60px rgba(32, 18, 80, .05);
        }
        .dashboard-nav-active {
            position: relative;
            background: linear-gradient(90deg, rgba(96, 54, 225, .1), rgba(216, 61, 194, .1));
            color: #6036e1;
        }
        .dashboard-nav-active::before {
            content: "";
            position: absolute;
            left: 6px;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 26px;
            background: #6036e1;
            border-radius: 999px;
        }
        .dashboard-nav-item {
            padding-left: 16px !important;
            padding-right: 16px !important;
        }
        .dashboard-footer {
            margin-top: auto;
            padding: 16px;
        }
        @media (max-width: 767px) {
            .dashboard-sidebar {
                width: 72px !important;
            }
            .dashboard-sidebar:hover {
                width: 72px !important;
            }
            .dashboard-sidebar .dashboard-label {
                display: none !important;
            }
            .dashboard-main {
                margin-left: 72px !important;
                padding: 24px 16px !important;
            }
        }

        /* ============================================================
           LOGIN OVERLAY
           ============================================================ */
        #login-view {
            position: fixed;
            inset: 0;
            z-index: 99999;
            width: 100vw;
            height: 100vh;
            background: #f8f8fc;
            overflow-y: auto;
        }
        #login-view[hidden] {
            display: none !important;
        }

        .loader {
            border: 3px solid rgba(96, 54, 225, 0.2);
            border-top-color: #6036E1;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .google-btn {
            transition: all 0.2s ease;
        }
        .google-btn:hover {
            background: #faf9ff;
            border-color: rgba(96, 54, 225, 0.3);
            box-shadow: 0 8px 20px rgba(32, 18, 80, 0.04);
            transform: translateY(-1px);
        }

        .premium-frame {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid #ececf3;
            box-shadow: 0 24px 80px rgba(32, 18, 80, 0.08);
        }

        /* ============================================================
           WALLET MODAL (Solana) – from wallet_connect.html
           ============================================================ */
        #feedWalletModal {
            position: fixed;
            inset: 0;
            z-index: 100000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(8, 7, 15, .62);
            backdrop-filter: blur(14px);
        }
        #feedWalletModal.open {
            display: flex;
        }
        #feedWalletModal .feed-wallet-dialog {
            width: min(560px, calc(100vw - 40px));
            max-height: min(820px, calc(100vh - 40px));
            overflow: hidden;
            border-radius: 32px;
            background: #fff;
            box-shadow: 0 35px 120px rgba(0, 0, 0, .28);
        }
        #feedWalletModal .feed-wallet-scroll {
            overflow-y: auto;
            max-height: calc(100vh - 40px);
            padding: 28px 28px 32px;
        }
        @media (max-width: 767px) {
            #feedWalletModal {
                padding: 12px;
            }
            #feedWalletModal .feed-wallet-dialog {
                width: 100%;
                max-height: calc(100vh - 24px);
                border-radius: 24px;
            }
            #feedWalletModal .feed-wallet-scroll {
                padding: 20px;
            }
        }

        #feedWalletQuick {
            position: fixed;
            right: 24px;
            bottom: 24px;
            z-index: 5000;
            display: none;
            align-items: center;
            gap: 8px;
            border-radius: 999px;
            background: #111018;
            color: #fff;
            padding: 12px 16px;
            font-size: 12px;
            font-weight: 800;
            box-shadow: 0 18px 50px rgba(0, 0, 0, .18);
            border: none;
            cursor: pointer;
        }
        body.dashboard-active #feedWalletQuick {
            display: inline-flex;
        }
        @media (max-width: 767px) {
            #feedWalletQuick {
                right: 16px;
                bottom: 16px;
            }
        }

        /* Wallet connect inner styles */
        .wallet-choice {
            border: 1px solid var(--line);
            background: white;
            transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
        }
        .wallet-choice:hover:not(:disabled) {
            transform: translateY(-2px);
            border-color: var(--violet);
            box-shadow: 0 10px 28px rgba(96, 54, 225, .12);
        }
        .wallet-choice:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        .custom-checkbox {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid #d1d1d6;
            border-radius: 6px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
        }
        .custom-checkbox:checked {
            background: var(--gradient);
            border-color: transparent;
        }
        .custom-checkbox:checked::after {
            content: '✓';
            position: absolute;
            color: white;
            font-size: 14px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        .view-section {
            display: none;
        }
        .view-section.active {
            display: block;
        }
        .fade-in {
            animation: fadeIn 0.4s ease forwards;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .spinner {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 3px solid rgba(96, 54, 225, 0.1);
            border-top-color: var(--violet);
            border-right-color: var(--magenta);
            animation: spin 1s linear infinite;
        }

        .success-ring {
            width: 78px;
            height: 78px;
            border-radius: 999px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #34d399, #10b981);
            box-shadow: 0 14px 35px rgba(16, 185, 129, .25);
            animation: successPop .55s cubic-bezier(.2, .8, .2, 1) both;
        }
        .success-ring i {
            animation: successCheck .45s .15s ease both;
        }
        @keyframes successPop {
            0% {
                opacity: 0;
                transform: scale(.55);
            }
            70% {
                transform: scale(1.08);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        @keyframes successCheck {
            from {
                opacity: 0;
                transform: scale(.4) rotate(-15deg);
            }
            to {
                opacity: 1;
                transform: scale(1) rotate(0);
            }
        }

        .zero-balance {
            color: #6b7280;
        }

        .wallet-card {
            border: 1px solid var(--line);
            transition: all 0.2s ease;
        }
        .wallet-card:hover {
            border-color: rgba(96, 54, 225, 0.45);
            box-shadow: 0 8px 24px rgba(96, 54, 225, 0.08);
        }

        /* Toast */
        #feed-toast-root {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000000;
            width: min(480px, calc(100vw - 40px));
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: none;
        }
        #feed-toast-root>* {
            pointer-events: auto;
        }
        .toast-item {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, .08);
            padding: 16px 20px;
            animation: fadeIn 0.3s ease;
        }
        .toast-item.error {
            border-color: #fecaca;
            background: #fef2f2;
        }
        .toast-item.success {
            border-color: #a7f3d0;
            background: #ecfdf5;
        }
        .toast-item.warning {
            border-color: #fde68a;
            background: #fffbeb;
        }

        /* ============================================================
           FIRESTORE INDEXING BADGE (UI indicator)
           ============================================================ */
        .firestore-badge {
            background: #1a1a2e;
            color: #a78bfa;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.08em;
            padding: 2px 10px;
            border-radius: 999px;
            border: 1px solid rgba(167, 139, 250, 0.2);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            text-transform: uppercase;
        }
        .firestore-badge i {
            font-size: 10px;
        }
        .firestore-badge.online {
            border-color: rgba(52, 211, 153, 0.4);
            color: #34d399;
        }
        .firestore-badge.offline {
            border-color: rgba(251, 191, 36, 0.4);
            color: #fbbf24;
        }
    </style>
</head>

        // Helpers
        function toast(title, message, type, details) {
            type = type || 'info';

            var root = document.getElementById('feed-toast-root');
            if (!root) {
                root = document.createElement('div');

                '</div><div class="text-sm text-gray-600 mt-1 whitespace-pre-wrap">' + esc(message) + '</div>' +
                (details ? '<details class="mt-2"><summary class="text-xs font-semibold text-gray-500 cursor-pointer">Technical details</summary><pre class="text-[10px] text-gray-500 whitespace-pre-wrap break-all mt-2 max-h-48 overflow-auto">' +

            item.querySelector('button').onclick = function() { item.remove(); };
            root.appendChild(item);
            if (type !== 'error') setTimeout(function() { item.remove(); }, 7500);
        }

        function timed(promise, label) {
            return Promise.race([
                promise,
                new Promise(function(_, reject) {
                    setTimeout(function() { reject(new Error(label + ' timed out after ' + OP_TIMEOUT +
                            'ms.')); }, OP_TIMEOUT);
                })
            ]);
        }

        async function rpcFetch(method, params) {
            params = params || [];
            var resp = await fetch(RPC_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: method, params: params })
            });
            if (!resp.ok) throw new Error('RPC HTTP Error: ' + resp.status);
            var data = await resp.json();
            if (data.error) throw new Error('RPC Error: ' + data.error.message);
            return data.result;
        }

        async function verifyDevnet() {
            var genesis = await rpcFetch('getGenesisHash');
            if (genesis !== DEVNET_GENESIS_HASH) {
                throw new Error('Genesis Hash mismatch! Expected Devnet (' + DEVNET_GENESIS_HASH + ') but got ' + genesis +
                    '.');
            }
        }

        async function getSolBalance(address) {
            var result = await rpcFetch('getBalance', [address]);
            return (result.value / 1e9).toFixed(4);
        }

        async function getTokenBalance(address, mint) {
            var result = await rpcFetch('getTokenAccountsByOwner', [
                address,
                { mint: mint },
                { encoding: 'jsonParsed' }
            ]);
            if (result.value && result.value.length > 0) {
                var amount = result.value[0].account.data.parsed.info.tokenAmount.uiAmount;
                return amount.toFixed(2);
            }
            return '0.00';
        }

            if (window.solflare && window.solflare.isSolflare) providers.push({ name: 'Solflare', provider: window
                    .solflare });
            if (window.backpack && window.backpack.isBackpack) providers.push({ name: 'Backpack', provider: window
                    .backpack });
            if (window.solana && !(window.phantom && window.phantom.solana && window.phantom.solana.isPhantom) && !(
                    window.solflare && window.solflare.isSolflare)) {
                providers.push({ name: 'Solana Wallet', provider: window.solana });
            }
            return providers;
        }

        async function connectWallet(entry) {
            if (walletBusy) return;
            walletBusy = true;
            DOM.wallet.btnDiscover.disabled = true;
            try {
                toast('Connecting wallet', 'Requesting account access from ' + entry.name +
                    '. Approve the request in the selected wallet application.');
                await entry.provider.connect();
                if (!entry.provider.publicKey) throw new Error("Wallet connected but did not provide a public key.");
                var address = entry.provider.publicKey.toString();
                DOM.wallet.loadingMessage.textContent =
                    'Verifying Devnet and querying balances for ' + address.slice(0, 4) + '...' + address.slice(-4);
                switchWalletView(DOM.wallet.loadingView);
                await loadWalletData(address, entry.name);
            } catch (err) {
                console.error(err);
                toast('Connection failed', err.message || 'Unknown wallet connection error', 'error');
                switchWalletView(DOM.wallet.choiceView);
            } finally {
                walletBusy = false;
                DOM.wallet.btnDiscover.disabled = false;
            }
        }

        async function loadWalletData(address, providerName) {
            fetchedAccounts = [];
            var row = {
                address: address,
                sol: '0.0000',
                feed: '0.00',
                usdc: '0.00',
                provider: providerName,
                warnings: []
            };
            try {
                await timed(verifyDevnet(), 'RPC Genesis Check');
            } catch (e) { row.warnings.push('Network: ' + e.message); }
            try { row.sol = await timed(getSolBalance(address), 'SOL Balance'); } catch (e) { row.warnings.push('SOL: ' + e
                    .message); }
            try { row.feed = await timed(getTokenBalance(address, FEED_MINT), '$FEED Balance'); } catch (e) { row
                    .warnings.push('$FEED: ' + e.message); }
            try { row.usdc = await timed(getTokenBalance(address, USDC_MINT), 'USDC Balance'); } catch (e) { row
                    .warnings.push('USDC: ' + e.message); }
            fetchedAccounts.push(row);
            renderWallets();
            switchWalletView(DOM.wallet.walletsView);
            var warnings = row.warnings.length;
            toast('Account scan complete', 'Solana Devnet account loaded successfully.', warnings ? 'warning' : 'success',
                warnings ? address + ': ' + row.warnings.join('; ') : '');
        }

        function renderWallets() {
            var account = fetchedAccounts[0];

                account.provider + '</div></div><div class="text-center"><div class="text-[9px] uppercase font-bold text-gray-400">$FEED</div><div class="font-bold text-lg mt-1">' +
                account.feed + '</div></div></div>';

            list.innerHTML = '';
            var card = document.createElement('div');
            card.className = 'wallet-card bg-white rounded-2xl overflow-hidden p-4';

                    '<span class="shrink-0 text-[9px] font-bold uppercase tracking-wide bg-gray-100 text-gray-500 px-2 py-1 rounded-full">0 FEED</span>' :
                    '') +
                '</div><div class="grid grid-cols-3 gap-2 mt-4"><div class="bg-gray-50 border border-gray-100 p-2 rounded-lg text-center"><div class="text-[9px] uppercase font-bold text-gray-400">SOL</div><div class="font-semibold text-xs mt-1">' +
                esc(account.sol) + '</div></div><div class="bg-gray-50 border border-gray-100 p-2 rounded-lg text-center"><div class="text-[9px] uppercase font-bold text-[#D83DC2]">$FEED</div><div class="font-bold text-xs mt-1 ' +
                (isZeroFeed ? 'zero-balance' : '') + '">' + esc(account.feed) +
                '</div></div><div class="bg-gray-50 border border-gray-100 p-2 rounded-lg text-center"><div class="text-[9px] uppercase font-bold text-blue-500">USDC</div><div class="font-bold text-xs mt-1">' +
                esc(account.usdc) + '</div></div></div>' +
                (account.warnings.length ?
                    '<div class="mt-3 bg-amber-50 border border-amber-100 rounded-lg p-2 text-[10px] text-amber-700">' +

        // Wallet flow event bindings
        (function bindWalletEvents() {
            var cb = document.getElementById('tos-checkbox');
            var btnProceed = document.getElementById('btn-proceed');
            if (cb && btnProceed) {
                var sync = function() {
                    btnProceed.disabled = !cb.checked;
                    btnProceed.setAttribute('aria-disabled', String(!cb.checked));
                };
                cb.addEventListener('change', sync);
                document.getElementById('tos-label') && document.getElementById('tos-label').addEventListener('click',
                    function() { requestAnimationFrame(sync); });
                sync();
            }

            document.getElementById('btn-proceed') && document.getElementById('btn-proceed').addEventListener('click',
            function() {
                if (document.getElementById('tos-checkbox').checked) {
                    switchWalletView(DOM.wallet.choiceView);
                    handleDiscoverWallets();
                }
            });

            document.getElementById('btn-discover-wallets') && document.getElementById('btn-discover-wallets')
                .addEventListener('click', handleDiscoverWallets);

            document.getElementById('btn-back-wallet-choice') && document.getElementById('btn-back-wallet-choice')
                .addEventListener('click', function() {
                    switchWalletView(DOM.wallet.tosView);
                });

            document.getElementById('btn-done') && document.getElementById('btn-done').addEventListener('click',
            function() {
                DOM.wallet.successMessage.textContent = 'The Solana Devnet account was scanned successfully.';
                switchWalletView(DOM.wallet.successView);
                saveWalletToFirestore(fetchedAccounts[0]);
            });

            document.getElementById('btn-scan-again') && document.getElementById('btn-scan-again').addEventListener(
                'click', async function() {
                    if (walletBusy) return;
                    switchWalletView(DOM.wallet.choiceView);
                    await handleDiscoverWallets();
                });

            document.getElementById('btn-return') && document.getElementById('btn-return').addEventListener('click',
                function() {
                    hideWalletModal();
                    updateDashboardUI();
                });

            if (DOM.wallet.modal) {
                DOM.wallet.modal.addEventListener('click', function(e) {
                    if (e.target === DOM.wallet.modal) hideWalletModal();
                });
            }

            if (DOM.wallet.quickBtn) {
                DOM.wallet.quickBtn.addEventListener('click', showWalletModal);
            }
            if (DOM.wallet.overviewConnect) {
                DOM.wallet.overviewConnect.addEventListener('click', showWalletModal);
            }
            if (DOM.wallet.profileConnect) {
                DOM.wallet.profileConnect.addEventListener('click', showWalletModal);
            }

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && DOM.wallet.modal && DOM.wallet.modal.classList.contains('open')) {
                    hideWalletModal();

        })();

        /* ============================================================
           FIRESTORE WALLET PERSISTENCE — Professional Indexing Architecture
           ============================================================ */
        function getLocalStorageKey(userId) {
            return 'feed_wallets_' + userId;
        }

        async function saveWalletToFirestore(account) {
            var auth = window.__feed && window.__feed.auth;
            if (!auth) return;
            var user = auth.currentUser;
            if (!user) return;
            var db = window.__feed && window.__feed.db;
            var uid = user.uid;

            var walletData = {
                address: account.address,
                provider: account.provider || 'Solana',
                network: APP_CONFIG.blockchain.network,
                isPrimary: linkedWallets.length === 0,
                balances: {
                    sol: account.sol || '0.0000',
                    feed: account.feed || '0.00',
                    usdc: account.usdc || '0.00'
                },
                firstConnected: new Date().toISOString(),
                lastUpdated: new Date().toISOString(),
                metadata: {
                    name: (account.provider || 'Solana') + ' Wallet',
                    chainId: 'solana-devnet'
                }
            };

            // Update in-memory linkedWallets
            linkedWallets = linkedWallets.filter(function(w) { return w.address !== account.address; });
            linkedWallets.push({
                address: account.address,
                provider: account.provider,
                network: APP_CONFIG.blockchain.network,
                sol: account.sol,
                feed: account.feed,
                usdc: account.usdc,
                updatedAt: new Date().toISOString()
            });
            if (linkedWallets.length > APP_CONFIG.limits.maxWallets) {
                linkedWallets = linkedWallets.slice(-APP_CONFIG.limits.maxWallets);
            }

            // LocalStorage fallback
            try {
                localStorage.setItem(getLocalStorageKey(uid), JSON.stringify(linkedWallets));
            } catch (e) {}

            // Firestore write
            if (db) {
                try {
                    var userRef = db.collection('users').doc(uid);
                    await userRef.set({
                        profile: {
                            displayName: user.displayName || 'Google user',
                            email: user.email || 'null',
                            photoURL: user.photoURL || null,
                            lastLogin: new Date().toISOString()
                        },
                        updatedAt: new Date().toISOString()
                    }, { merge: true });

                    var walletRef = userRef.collection('wallets').doc(account.address);
                    await walletRef.set(walletData, { merge: true });

                    // If first wallet, set as primary
                    if (linkedWallets.length === 1) {
                        var allWallets = await userRef.collection('wallets').get();
                        var batch = db.batch();
                        allWallets.forEach(function(doc) {
                            if (doc.id !== account.address) {
                                batch.update(doc.ref, { isPrimary: false });
                            }
                        });
                        batch.update(walletRef, { isPrimary: true });
                        await batch.commit();
                    }

                    toast('Wallet saved', 'Address ' + shortAddress(account.address) +
                        ' linked to your Google account.', 'success');
                } catch (err) {
                    console.warn('Firestore save failed, using localStorage fallback:', err);
                    toast('Wallet saved locally', 'Address ' + shortAddress(account.address) +
                        ' stored in your browser (offline mode).', 'warning');
                }
            } else {
                toast('Wallet saved locally', 'Address ' + shortAddress(account.address) +
                    ' stored in your browser (Firestore unavailable).', 'warning');
            }

            updateDashboardUI();
        }

        async function loadUserWallets(user) {
            if (!user) return;
            var db = window.__feed && window.__feed.db;
            var uid = user.uid;

            if (db) {
                try {
                    var userRef = db.collection('users').doc(uid);
                    var snapshot = await userRef.collection('wallets')
                        .orderBy('lastUpdated', 'desc')
                        .limit(APP_CONFIG.limits.maxWallets)
                        .get();

                    if (!snapshot.empty) {
                        var loaded = [];
                        snapshot.forEach(function(doc) {
                            var data = doc.data();
                            loaded.push({
                                address: data.address || doc.id,
                                provider: data.provider || 'Solana',
                                network: data.network || APP_CONFIG.blockchain.network,
                                sol: data.balances && data.balances.sol || '0.0000',
                                feed: data.balances && data.balances.feed || '0.00',
                                usdc: data.balances && data.balances.usdc || '0.00',
                                updatedAt: data.lastUpdated || data.firstConnected || new Date()
                                    .toISOString(),
                                isPrimary: data.isPrimary || false
                            });
                        });
                        if (loaded.length) {
                            linkedWallets = loaded;
                            try {
                                localStorage.setItem(getLocalStorageKey(uid), JSON.stringify(linkedWallets));
                            } catch (e) {}
                            updateDashboardUI();
                            toast('Wallets loaded', linkedWallets.length +
                                ' wallet(s) restored from your account.', 'info');
                            return;
                        }
                    }
                } catch (err) {
                    console.warn('Firestore load failed, checking localStorage:', err);
                }
            }

            // Fallback: localStorage
            try {
                var stored = localStorage.getItem(getLocalStorageKey(uid));
                if (stored) {
                    var parsed = JSON.parse(stored);
                    if (Array.isArray(parsed) && parsed.length) {
                        linkedWallets = parsed;
                        updateDashboardUI();
                        toast('Wallets loaded from local cache', linkedWallets.length +
                            ' wallet(s) restored.', 'info');
                        return;
                    }
                }
            } catch (e) {}

            linkedWallets = [];
            updateDashboardUI();
        }

        async function setPrimaryWallet(address) {
            var auth = window.__feed && window.__feed.auth;
            if (!auth) return;
            var user = auth.currentUser;
            if (!user) return;
            var db = window.__feed && window.__feed.db;
            if (!db) return;
            var uid = user.uid;

            try {
                var userRef = db.collection('users').doc(uid);
                var allWallets = await userRef.collection('wallets').get();
                var batch = db.batch();
                allWallets.forEach(function(doc) {
                    batch.update(doc.ref, { isPrimary: doc.id === address });
                });
                await batch.commit();
                linkedWallets.forEach(function(w) {
                    w.isPrimary = w.address === address;
                });
                updateDashboardUI();
                toast('Primary wallet updated', 'Wallet ' + shortAddress(address) + ' is now primary.', 'success');
            } catch (err) {
                console.error('Failed to update primary wallet:', err);
                toast('Update failed', 'Could not update primary wallet designation.', 'error');
            }
        }

        async function deleteWalletFromFirestore(address) {
            var auth = window.__feed && window.__feed.auth;
            if (!auth) return;
            var user = auth.currentUser;
            if (!user) return;
            var db = window.__feed && window.__feed.db;
            var uid = user.uid;

            try {
                if (db) {
                    var userRef = db.collection('users').doc(uid);
                    await userRef.collection('wallets').doc(address).delete();
                }
                linkedWallets = linkedWallets.filter(function(w) { return w.address !== address; });
                try {
                    localStorage.setItem(getLocalStorageKey(uid), JSON.stringify(linkedWallets));
                } catch (e) {}
                updateDashboardUI();
                toast('Wallet removed', 'Address ' + shortAddress(address) + ' disconnected.', 'info');
                return true;
            } catch (err) {
                console.error('Failed to delete wallet:', err);
                toast('Delete failed', 'Could not remove wallet from Firestore.', 'error');
                return false;
            }
        }

        /* ============================================================
           DASHBOARD UI UPDATE
           ============================================================ */
        function updateDashboardUI() {
            var wallet = linkedWallets.length ? linkedWallets[0] : null;
            var hasWallet = !!wallet;
            var addr = hasWallet ? wallet.address : null;
            var short = addr ? shortAddress(addr) : 'No wallet';

            if (DOM.dashboard.walletShort) DOM.dashboard.walletShort.textContent = short;
            if (DOM.dashboard.walletAddress) DOM.dashboard.walletAddress.textContent = short;
            if (DOM.dashboard.profileWalletAddress) DOM.dashboard.profileWalletAddress.textContent = short || 'null';
            if (DOM.wallet.quickText) DOM.wallet.quickText.textContent = hasWallet ?
                linkedWallets.length + '/' + APP_CONFIG.limits.maxWallets + ' wallets' :
                'Connect wallet';

            var sol = hasWallet ? wallet.sol || '0.0000' : '0.0000';
            var feed = hasWallet ? wallet.feed || '0.00' : '0.00';
            var usdc = hasWallet ? wallet.usdc || '0.00' : '0.00';

            if (DOM.dashboard.solBalance) DOM.dashboard.solBalance.textContent = sol;
            if (DOM.dashboard.availableFeed) DOM.dashboard.availableFeed.textContent = feed;
            if (DOM.dashboard.usdcBalance) DOM.dashboard.usdcBalance.textContent = usdc;
            if (DOM.dashboard.feedBalance) DOM.dashboard.feedBalance.innerHTML = feed +
                ' <span class="text-3xl text-emerald-200/80">$FEED</span>';

            if (DOM.dashboard.profileSolBalance) DOM.dashboard.profileSolBalance.textContent = sol;
            if (DOM.dashboard.profileFeedBalance) DOM.dashboard.profileFeedBalance.textContent = feed;
            if (DOM.dashboard.profileUsdcBalance) DOM.dashboard.profileUsdcBalance.textContent = usdc;

            if (DOM.dashboard.settings && !DOM.dashboard.settings.classList.contains('hidden')) {
                renderSettingsView();
            }
        }

        /* ============================================================
           SETTINGS VIEW — Firestore management
           ============================================================ */
        function renderSettingsView() {
            var el = DOM.dashboard.settings;
            if (!el) return;
            el.innerHTML =
                '<div class="dashboard-glass rounded-[2.5rem] p-8 md:p-10">' +
                '<div class="flex items-center justify-between">' +
                '<div><div class="text-xs font-bold uppercase tracking-[.2em] text-[#6036E1]">Settings</div><h2 class="mt-3 font-display text-3xl font-black">Wallet &amp; account controls</h2><p class="mt-2 max-w-2xl text-sm leading-relaxed text-gray-500">Manage the Solana wallets linked to this Google account. Data is stored in Firestore with professional indexing.</p></div>' +
                '<span class="firestore-badge online"><i class="ph-bold ph-database"></i> users/{uid}/wallets/</span>' +
                '</div>' +
                '<div class="mt-8 grid gap-4 md:grid-cols-2">' +
                '<div class="rounded-3xl border border-gray-200 bg-white p-6"><div class="flex h-11 w-11 items-center justify-center rounded-2xl bg-gray-100 text-gray-700"><i class="ph-bold ph-wallet text-2xl"></i></div><h3 class="mt-4 font-display text-lg font-bold">Wallet connections</h3><p class="mt-2 text-sm leading-relaxed text-gray-500">Connect up to three Solana wallets. Each wallet is stored as a separate document in Firestore for efficient querying.</p><button id="feedSettingsAdd" type="button" class="mt-5 rounded-xl bg-gray-900 px-4 py-2.5 text-sm font-bold text-white">' +
                (linkedWallets.length >= APP_CONFIG.limits.maxWallets ? 'Manage below' : 'Add wallet') +
                '</button></div>' +
                '<div class="rounded-3xl border border-red-100 bg-red-50 p-6"><div class="flex h-11 w-11 items-center justify-center rounded-2xl bg-white text-red-600"><i class="ph-bold ph-plugs-connected text-2xl"></i></div><h3 class="mt-4 font-display text-lg font-bold text-red-900">Disconnect entirely</h3><p class="mt-2 text-sm leading-relaxed text-red-800/70">Remove every saved wallet association from this Google account. Nothing on-chain is changed.</p><button id="feedSettingsDisconnectAll" type="button" class="mt-5 rounded-xl border border-red-200 bg-white px-4 py-2.5 text-sm font-bold text-red-700 hover:bg-red-100">Disconnect all wallets</button></div>' +
                '</div>' +
                '<div class="mt-6 flex items-center gap-2 text-xs text-gray-400 border-b border-gray-100 pb-4"><i class="ph-bold ph-info"></i><span>Each wallet is indexed by <strong>address</strong>, <strong>network</strong>, and <strong>lastUpdated</strong> for fast queries.</span></div>' +
                '<div id="feedSettingsWallets" class="mt-6 space-y-3"></div>' +
                '<div id="feedSettingsMessage" class="mt-4 hidden rounded-2xl px-4 py-3 text-sm"></div></div>';

            var list = el.querySelector('#feedSettingsWallets');
            if (!linkedWallets.length) {
                list.innerHTML =
                    '<div class="rounded-2xl border border-dashed border-gray-200 bg-gray-50 p-6 text-center text-sm text-gray-500">No linked wallets. Connect one above.</div>';
            } else {
                linkedWallets.forEach(function(w, i) {
                    var isPrimary = w.isPrimary === true;
                    var row = document.createElement('div');
                    row.className =
                        'rounded-2xl border ' + (isPrimary ?
                            'border-[#6036E1]/30 bg-violet-50/50' :
                            'border-gray-200 bg-white') + ' p-4 transition';
                    row.innerHTML =
                        '<div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">' +
                        '<div><div class="flex items-center gap-2"><span class="font-semibold">Wallet ' + (i +
                            1) + ' · ' + (w.provider || 'Solana') + '</span>' +
                        (isPrimary ?
                            '<span class="text-[9px] font-bold uppercase tracking-wide bg-[#6036E1] text-white px-2 py-0.5 rounded-full">Primary</span>' :
                            '') +
                        (!isPrimary && linkedWallets.length > 1 ?
                            '<button type="button" data-set-primary class="text-[10px] font-bold text-[#6036E1] hover:underline">Set primary</button>' :
                            '') +
                        '</div><div class="mt-1 font-mono text-xs text-gray-500">' + w.address +
                        '</div><div class="mt-1 flex gap-4 text-xs text-gray-400"><span>SOL: ' + (w.sol ||
                            '0.0000') + '</span><span>$FEED: ' + (w.feed || '0.00') +
                        '</span><span>USDC: ' + (w.usdc || '0.00') +
                        '</span></div></div><button type="button" data-delete class="rounded-xl border border-gray-200 px-3 py-2 text-xs font-bold text-gray-600 hover:border-red-200 hover:bg-red-50 hover:text-red-700">Remove</button></div>';
                    var primaryBtn = row.querySelector('[data-set-primary]');
                    if (primaryBtn) {
                        primaryBtn.addEventListener('click', async function() {
                            await setPrimaryWallet(w.address);
                            renderSettingsView();
                        });
                    }
                    row.querySelector('[data-delete]').addEventListener('click', async function() {
                        if (!confirm('Remove wallet ' + shortAddress(w.address) +
                                ' from your account?')) return;
                        await deleteWalletFromFirestore(w.address);
                        renderSettingsView();
                    });
                    list.appendChild(row);
                });
            }

            el.querySelector('#feedSettingsAdd').addEventListener('click', showWalletModal);
            el.querySelector('#feedSettingsDisconnectAll').addEventListener('click', async function() {
                if (!window.confirm(
                        'Disconnect and remove every saved wallet association from this Google account?')
                    ) return;
                var addresses = linkedWallets.map(function(w) { return w.address; });
                var db = window.__feed && window.__feed.db;
                var user = window.__feed && window.__feed.auth && window.__feed.auth.currentUser;
                if (db && user) {
                    var userRef = db.collection('users').doc(user.uid);
                    var batch = db.batch();
                    addresses.forEach(function(addr) {
                        batch.delete(userRef.collection('wallets').doc(addr));
                    });
                    await batch.commit();
                }
                linkedWallets = [];
                if (user) {
                    try {
                        localStorage.setItem(getLocalStorageKey(user.uid), JSON.stringify([]));
                    } catch (e) {}
                }
                updateDashboardUI();
                var msg = el.querySelector('#feedSettingsMessage');
                msg.className =
                    'mt-4 rounded-2xl border border-emerald-100 bg-emerald-50 px-4 py-3 text-sm text-emerald-700';
                msg.textContent = 'All wallet associations have been removed from this Google account.';
                msg.classList.remove('hidden');
                renderSettingsView();
                toast('All wallets disconnected', 'Your wallet associations have been cleared.', 'success');
            });
        }

        /* ============================================================
           REVEAL ANIMATIONS
           ============================================================ */
        (function initReveal() {
            var nodes = document.querySelectorAll('.reveal');
            if ('IntersectionObserver' in window) {
                var obs = new IntersectionObserver(function(entries) {
                    entries.forEach(function(entry) {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('is-visible');
                            obs.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
                nodes.forEach(function(n) { obs.observe(n); });
            } else {
                nodes.forEach(function(n) { n.classList.add('is-visible'); });
            }
        })();

        /* ============================================================
           ROUTING
           ============================================================ */
        (function initRouting() {
            function syncRoute() {
                var hash = location.hash.toLowerCase();
                if (hash === '#login') {
                    if (APP_STATE.auth.status === 'authenticated') setView('dashboard');
                    else setView('login');
                } else if (hash === '#dashboard') {
                    if (APP_STATE.auth.status === 'authenticated') setView('dashboard');
                    else setView('landing');
                } else {
                    setView('landing');
                }
            }
            window.addEventListener('hashchange', syncRoute);
            window.addEventListener('popstate', syncRoute);
            syncRoute();
        })();

        /* ============================================================
           WALLET REFRESH TIMER
           ============================================================ */
        setInterval(function() {
            if (document.body.classList.contains('dashboard-active') && linkedWallets.length) {
                // placeholder for future refresh
            }
        }, APP_CONFIG.limits.walletRefreshMs);

        console.log('FEED initialized with new Firebase project: ropay-11bf2');
        APP_STATE.initialized = true;
    </script>
