<!DOCTYPE html>

        @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --violet: #6036E1;
            --magenta: #D83DC2;
            --ink: #0b0b12;
            --gradient: linear-gradient(to right, #6036E1, #D83DC2);
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--ink);
            background-color: #f8f8fc;
            margin: 0;
            overflow-x: hidden;
        }

        .font-display { font-family: 'Archivo', sans-serif; }

        .text-gradient {
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
        }

        .bg-gradient-custom {
            background: var(--gradient);
            transition: transform 0.25s ease, box-shadow 0.25s ease, opacity 0.25s ease;
        }

        .bg-gradient-custom:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 16px 35px rgba(96,54,225,0.22);
        }

        .premium-frame {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid #ececf3;
            box-shadow: 0 24px 80px rgba(32, 18, 80, 0.08);
        }

        .google-btn {
            transition: all 0.2s ease;
        }
        
        .google-btn:hover {
            background: #faf9ff;
            border-color: rgba(96,54,225,0.3);
            box-shadow: 0 8px 20px rgba(32, 18, 80, 0.04);
            transform: translateY(-1px);
        }

        /* Custom spinner for loading state */
        .loader {
            border: 3px solid rgba(96,54,225,0.2);
            border-top-color: #6036E1;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>

    &lt;script&gt;
        const canvas = document.getElementById(&#x27;canvas&#x27;); const ctx = canvas.getContext(&#x27;2d&#x27;);
        const scenes = document.querySelectorAll(&#x27;.scene-content&#x27;);
        let width, height, currentScene = 0, frame = 0, loopActive = true;
        const SPEED = 14; const SCENE_DURATION = 140; 
        function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
        window.addEventListener(&#x27;resize&#x27;, resize); resize();
        class Particle {
            constructor(preWarm = false) { this.reset(preWarm); }
            reset(preWarm = false) {
                this.x = (Math.random() - 0.5) * 4500; this.y = (Math.random() - 0.5) * 4500;
                this.z = preWarm ? Math.random() * 2000 : 2000; this.pz = this.z;
                this.size = Math.random() * 1.5 + 1; this.color = Math.random() &gt; 0.5 ? &#x27;#6366f1&#x27; : &#x27;#a855f7&#x27;;
            }
            update() { this.pz = this.z; this.z -= SPEED; if (this.z &lt; 1) this.reset(); }
            draw() {
                const s = 800 / this.z; const ps = 800 / this.pz;
                const x = this.x * s + width/2; const y = this.y * s + height/2;
                const px = this.x * ps + width/2; const py = this.y * ps + height/2;
                ctx.globalAlpha = Math.min(0.4, (1600 - this.z) / 1000);
                ctx.strokeStyle = this.color; ctx.lineWidth = this.size * s; ctx.lineCap = &#x27;round&#x27;;
                ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(px, py); ctx.stroke();
            }
        }
        const particles = Array.from({length: 600}, () =&gt; new Particle(true));
        let finaleTimeline = null; let animationFrameId = null; let sceneTimeouts = [];
        function clearSceneTimeouts() { sceneTimeouts.forEach(id =&gt; clearTimeout(id)); sceneTimeouts = []; }
        function resetToStart() {
            clearSceneTimeouts();
            if (finaleTimeline) { finaleTimeline.kill(); finaleTimeline = null; }
            const finaleStage = document.getElementById(&#x27;finaleStage&#x27;);
            const mainContent = document.getElementById(&#x27;mainContent&#x27;);
            gsap.set(finaleStage, { display: &#x27;none&#x27;, opacity: 1 }); gsap.set(mainContent, { display: &#x27;block&#x27;, opacity: 1 });
            gsap.set(&quot;#feedFinalText&quot;, { clipPath: &quot;inset(100% 0% 0% 0%)&quot;, opacity: 1 });
            gsap.set(&quot;#urlLayer&quot;, { opacity: 0, y: 0 }); gsap.set(&quot;#introFrame&quot;, { scale: 1, x: 0, opacity: 1 });
            gsap.set(&quot;#logoFinal&quot;, { opacity: 0, scale: 0.8 });
            currentScene = 0; frame = 0; loopActive = true;
            scenes.forEach(s =&gt; s.classList.remove(&#x27;active&#x27;, &#x27;exit&#x27;)); scenes[0].classList.add(&#x27;active&#x27;);
            animationFrameId = requestAnimationFrame(animate);
        }
        function runFinale() {
            const mainContent = document.getElementById(&#x27;mainContent&#x27;);
            const finaleStage = document.getElementById(&#x27;finaleStage&#x27;);
            gsap.to(mainContent, { opacity: 0, duration: 0.45, ease: &quot;power1.out&quot;, onComplete: () =&gt; { mainContent.style.display = &#x27;none&#x27;; finaleStage.style.display = &#x27;flex&#x27;; finaleStage.style.opacity = &#x27;1&#x27;; startGSAPFinale(); } });
        }
        function startGSAPFinale() {
            finaleTimeline = gsap.timeline({ onComplete: () =&gt; { resetToStart(); } });
            finaleTimeline.to(&quot;#feedFinalText&quot;, { clipPath: &quot;inset(0% 0% 0% 0%)&quot;, duration: 1.05, ease: &quot;power3.out&quot; })
                .to(&quot;#urlLayer&quot;, { opacity: 1, y: -10, duration: 0.55, ease: &quot;power2.out&quot; }, &quot;-=0.15&quot;)
                .to({}, { duration: 1.0 })
                .to(&quot;#introFrame&quot;, { scale: 24, x: &quot;10%&quot;, opacity: 0, duration: 1.1, ease: &quot;expo.in&quot; })
                .to(&quot;#logoFinal&quot;, { opacity: 1, scale: 1, duration: 0.75, ease: &quot;power2.out&quot; }, &quot;-=0.85&quot;)
                .to({}, { duration: 1.25 });
        }
        function animate() {
            if (!loopActive) return; frame++;
            if (frame &gt;= SCENE_DURATION) {
                frame = 0;
                if (currentScene === scenes.length - 1) { loopActive = false; runFinale(); return; }
                const previousScene = currentScene;
                scenes[previousScene].classList.remove(&#x27;active&#x27;); scenes[previousScene].classList.add(&#x27;exit&#x27;);
                sceneTimeouts.push(setTimeout(() =&gt; { if (scenes[previousScene]) { scenes[previousScene].classList.remove(&#x27;exit&#x27;); } }, 800));
                currentScene++; scenes[currentScene].classList.add(&#x27;active&#x27;);
            }
            ctx.fillStyle = &#x27;rgba(255, 255, 255, 0.72)&#x27;; ctx.fillRect(0, 0, width, height);
            particles.forEach(p =&gt; { p.update(); p.draw(); });
            animationFrameId = requestAnimationFrame(animate);
        }
        resetToStart();
    &lt;/script&gt;

    <!-- Firebase Google Authentication -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
        import {
            getAuth,
            signInWithRedirect,
            getRedirectResult,
            GoogleAuthProvider,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
        import {
            getFirestore,
            doc,
            setDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBxWL2LIcibm6-NftEZMcs7SkhGjoQ9GpU",
            authDomain: "feed-65b35.firebaseapp.com",
            projectId: "feed-65b35",
            storageBucket: "feed-65b35.firebasestorage.app",
            messagingSenderId: "1085499159984",
            appId: "1:1085499159984:web:317e0443941085964a5275",
            measurementId: "G-FVPRRX9X1M"
        };

        const signInBtn = document.getElementById("googleSignInBtn");
        const btnText = document.getElementById("btn-text");
        const btnLoader = document.getElementById("btn-loader");
        const errorContainer = document.getElementById("error-message");

        function getForensicDetails() {
            return {
                userAgent: navigator.userAgent || "Unknown",
                platform: navigator.platform || "Unknown",
                language: navigator.language || "Unknown",
                screenResolution: `${window.screen.width}x${window.screen.height}`,
                timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                vendor: navigator.vendor || "Unknown",
                cookiesEnabled: navigator.cookieEnabled
            };
        }

        function logInfo(message, data = null) {
            console.log(`[FEED AUTH] ${message}`, data ?? "");
        }

        function setLoading(message) {
            signInBtn.disabled = true;
            btnText.textContent = message;
            btnLoader.style.display = "block";
        }

        function resetButton() {
            signInBtn.disabled = false;
            btnText.textContent = "Continue with Google";
            btnLoader.style.display = "none";
        }

        function showError(error) {
            console.error("[FEED AUTH] Authentication error:", error);
            const code = error?.code || "unknown";
            const message = error?.message || "Google sign-in could not be completed.";
            errorContainer.textContent = `Authentication failed (${code}): ${message}`;
            errorContainer.classList.remove("hidden");
            resetButton();
        }

        async function saveUserProfile(user) {
            try {
                const db = getFirestore(app);
                await setDoc(
                    doc(db, "users", user.uid),
                    {
                        uid: user.uid,
                        email: user.email || null,
                        displayName: user.displayName || null,
                        photoURL: user.photoURL || null,
                        lastLogin: serverTimestamp(),
                        authProvider: "Google",
                        forensics: getForensicDetails()
                    },
                    { merge: true }
                );
                logInfo("Firestore user profile synchronized.");
            } catch (error) {
                console.warn("[FEED AUTH] Firestore profile sync failed:", error);
            }
        }

        let app;
        let auth;
        let provider;

        logInfo("Initializing Firebase...");

        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            provider = new GoogleAuthProvider();

            // EXACTLY the supplied tester behavior.
            provider.setCustomParameters({
                prompt: "select_account"
            });

            logInfo("Firebase initialized. Checking for redirect results...");
        } catch (error) {
            showError(error);
        }

        // EXACTLY the supplied tester behavior.
        if (auth) {
            getRedirectResult(auth)
                .then(async (result) => {
                    if (result) {
                        logInfo("Redirect Sign-In Resolved SUCCESSFULLY!", {
                            uid: result.user.uid,
                            email: result.user.email
                        });

                        setLoading("Finalizing setup...");
                        await saveUserProfile(result.user);

                        btnText.textContent = "Redirecting...";
                        window.location.replace("/dashboard.html");
                    }
                })
                .catch((error) => {
                    logInfo("Redirect Sign-In FAILED.", error);
                    showError(error);
                });

            // EXACTLY the supplied tester behavior.
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    logInfo("Auth State Fired: USER IS LOGGED IN", {
                        uid: user.uid,
                        email: user.email
                    });
                } else {
                    logInfo("Auth State Fired: NO USER (Logged out)");
                }
            });
        }

        const btnLogin = signInBtn;

        btnLogin.addEventListener("click", () => {
            try {
                errorContainer.classList.add("hidden");
                setLoading("Connecting to Google...");
                logInfo("Navigating away to full Google Sign-In page...");

                // EXACTLY the supplied tester behavior.
                signInWithRedirect(auth, provider);
            } catch (error) {
                showError(error);
            }
        });
    </script>
