<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web3 EIP-6963 Isolated Connector</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #0b0f19;
            color: #38bdf8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            width: 100%;
        }
        h2 { color: #f8fafc; margin-top: 0; }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 18px;
            margin: 6px 0;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background-color: #1d4ed8; }
        .trust-btn { background-color: #3b82f6; }
        .trust-btn:hover { background-color: #2563eb; }
        button:disabled { background-color: #475569; cursor: not-allowed; opacity: 0.6; }
        
        #debug-console {
            background: #020617;
            border: 1px solid #1e293b;
            color: #4ade80;
            padding: 12px;
            border-radius: 6px;
            height: 180px;
            overflow-y: auto;
            font-size: 12px;
            margin-top: 20px;
            text-align: left;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .log-error { color: #f87171; }
        .log-info { color: #38bdf8; }
        .log-success { color: #4ade80; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🛠️ EIP-6963 Isolated Wallet Test</h2>
        <p style="color: #94a3b8; font-size: 14px;">Project ID: <code>7d7ef210c61dbe38335f827df3368220</code></p>
        
        <!-- Isolated Action Buttons -->
        <button id="metaMaskBtn" onclick="connectSpecificWallet('MetaMask')" disabled>🔗 Connect MetaMask (Waiting for discovery...)</button>
        <button class="trust-btn" id="trustBtn" onclick="connectSpecificWallet('Trust Wallet')" disabled>🔗 Connect Trust Wallet (Waiting for discovery...)</button>
        
        <!-- Live Debug Output Terminal -->
        <div id="debug-console">[SYSTEM] Initializing EIP-6963 multi-provider listener...</div>
    </div>

    <script>
        const PROJECT_ID = '7d7ef210c61dbe38335f827df3368220';
        
        // Store discovered providers safely by name or RDNS
        const discoveredProviders = new Map();

        function debugLog(message, type = 'info') {
            const timestamp = new Date().toISOString().split('T')[1].slice(0, -1);
            const formattedMsg = `[${timestamp}] [${type.toUpperCase()}] ${message}`;
            
            if (type === 'error') console.error(formattedMsg);
            else if (type === 'success') console.log('%c ' + formattedMsg, 'color: #4ade80; font-weight: bold;');
            else console.log(formattedMsg);

            const consoleEl = document.getElementById('debug-console');
            const colorClass = type === 'error' ? 'log-error' : (type === 'success' ? 'log-success' : 'log-info');
            consoleEl.innerHTML += `<div class="${colorClass}">${formattedMsg}</div>`;
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }

        // --- EIP-6963 Provider Discovery Listener ---
        window.addEventListener('eip6963:announceProvider', (event) => {
            const { info, provider } = event.detail;
            debugLog(`Discovered provider: ${info.name} (RDNS: ${info.rdns})`, 'success');
            
            discoveredProviders.set(info.name.toLowerCase(), { info, provider });

            // Enable matching UI buttons dynamically based on actual extensions found
            if (info.name.toLowerCase().includes('metamask')) {
                const btn = document.getElementById('metaMaskBtn');
                btn.disabled = false;
                btn.innerText = "🔗 Connect MetaMask Extension";
            }
            if (info.name.toLowerCase().includes('trust')) {
                const btn = document.getElementById('trustBtn');
                btn.disabled = false;
                btn.innerText = "🔗 Connect Trust Wallet Extension";
            }
        });

        // Broadcast request to prompt all browser extensions to announce themselves
        window.dispatchEvent(new Event('eip6963:requestProvider'));

        // Fallback check after 1 second if EIP-6963 announcements take a moment or legacy injection overrides
        setTimeout(() => {
            if (discoveredProviders.size === 0 && window.ethereum) {
                debugLog("No EIP-6963 announcements captured. Falling back to legacy window.ethereum parsing...", 'info');
                
                if (window.ethereum.isMetaMask) {
                    discoveredProviders.set('metamask', { info: { name: 'MetaMask' }, provider: window.ethereum });
                    const btn = document.getElementById('metaMaskBtn');
                    btn.disabled = false;
                    btn.innerText = "🔗 Connect MetaMask Extension (Legacy)";
                }
                if (window.ethereum.isTrust || window.trustwallet) {
                    const trustProv = window.trustwallet || window.ethereum;
                    discoveredProviders.set('trust wallet', { info: { name: 'Trust Wallet' }, provider: trustProv });
                    const btn = document.getElementById('trustBtn');
                    btn.disabled = false;
                    btn.innerText = "🔗 Connect Trust Wallet Extension (Legacy)";
                }
            }
        }, 1000);

        // --- Targeted Connection Function ---
        async function connectSpecificWallet(walletName) {
            debugLog(`--- Starting connection routine explicitly for: ${walletName} ---`, 'info');
            const targetKey = walletName.toLowerCase();
            const walletEntry = discoveredProviders.get(targetKey);

            if (!walletEntry) {
                debugLog(`Error: ${walletName} provider instance was not found in discovered extension map.`, 'error');
                return;
            }

            const provider = walletEntry.provider;

            try {
                debugLog(`Dispatching 'eth_requestAccounts' specifically to ${walletName}...`, 'info');
                const accounts = await provider.request({ method: 'eth_requestAccounts' });

                if (!accounts || accounts.length === 0) {
                    throw new Error("Authorization request rejected or empty response.");
                }

                const connectedAccount = accounts[0];
                debugLog(`Successfully connected ${walletName}!`, 'success');
                debugLog(`Active Account: ${connectedAccount}`, 'success');

                const chainId = await provider.request({ method: 'eth_chainId' });
                debugLog(`Network Chain ID: ${chainId}`, 'info');

            } catch (err) {
                debugLog(`Connection failed for ${walletName}: ${err.message}`, 'error');
            }
        }
    </script>
</body>
</html>
