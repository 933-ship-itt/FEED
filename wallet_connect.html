<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web3 Wallet Connector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 8px 0;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2563eb;
        }
        .secondary {
            background-color: #475569;
        }
        .secondary:hover {
            background-color: #334155;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            word-break: break-all;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Connect Your Wallet</h2>
        <p>Select your preferred wallet provider below:</p>
        
        <!-- Native Browser Extension Detection (MetaMask / Trust Wallet injected providers) -->
        <button onclick="connectInjectedWallet('metamask')">Connect MetaMask (Extension)</button>
        <button onclick="connectInjectedWallet('trust')">Connect Trust Wallet (Extension)</button>
        
        <!-- Universal WalletConnect Modal (Supports QR Code & Mobile Deep Linking) -->
        <button class="secondary" onclick="openWalletConnectModal()">Open WalletConnect Modal</button>
        
        <div id="status">Status: Disconnected</div>
    </div>

    <!-- Load Web3Modal / AppKit via UMD CDN -->
    <script type="module">
        import { createAppKit, defaultConfig } from 'https://esm.sh/@reown/appkit@latest'

        // Your specific Project ID
        const projectId = '7d7ef210c61dbe38335f827df3368220';

        // Metadata setup
        const metadata = {
            name: 'Web3 dApp Example',
            description: 'Simple Wallet Connector',
            url: window.location.origin,
            icons: ['https://avatars.githubusercontent.com/u/37784886']
        }

        // Initialize Reown AppKit Modal
        const modal = createAppKit({
            adapters: [],
            metadata,
            projectId,
            features: { analytics: true }
        });

        // Expose modal trigger globally to HTML buttons
        window.openWalletConnectModal = function() {
            modal.open();
        }
    </script>

    <script>
        // Direct Browser Extension Detection & Connection Handler
        async function connectInjectedWallet(walletType) {
            const statusEl = document.getElementById('status');
            let provider = null;

            // Check injected providers in window.ethereum or window.trustwallet
            if (walletType === 'metamask') {
                if (window.ethereum) {
                    // If multiple providers exist, target MetaMask explicitly if available
                    provider = window.ethereum.providers ? window.ethereum.providers.find(p => p.isMetaMask) : window.ethereum;
                    if (!provider?.isMetaMask) {
                        statusEl.innerText = "Status: MetaMask extension not detected!";
                        return;
                    }
                }
            } else if (walletType === 'trust') {
                if (window.trustwallet) {
                    provider = window.trustwallet;
                } else if (window.ethereum && window.ethereum.isTrust) {
                    provider = window.ethereum;
                } else {
                    statusEl.innerText = "Status: Trust Wallet extension not detected!";
                    return;
                }
            }

            if (provider) {
                try {
                    statusEl.innerText = "Status: Requesting permission...";
                    const accounts = await provider.request({ method: 'eth_requestAccounts' });
                    const userAccount = accounts[0];
                    statusEl.innerHTML = `Connected: <span style="color: #4ade80;">${userAccount.substring(0, 6)}...${userAccount.substring(38)}</span>`;
                } catch (error) {
                    statusEl.innerText = `Status: Connection rejected (${error.message})`;
                }
            } else {
                statusEl.innerText = `Status: No Web3 extension found for ${walletType}.`;
            }
        }
    </script>
</body>
</html>
